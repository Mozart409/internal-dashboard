[package]
name = "internal-dashboard"
version = "0.2.1"
edition = "2024"
publish = false
license = "MIT"

# Tuned for compile speed over runtime speed — this is an internal dashboard,
# not perf-critical. opt-level 3 vs 2 costs real compile time for little gain
# here; codegen-units above the default 16 trades a bit more of that for more
# parallelism. LTO is left off (the default) since it's the single biggest
# release-compile-time cost of all these knobs.
[profile.release]
opt-level = 2
codegen-units = 32

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
# priority -1 so the individual allows below can override the group.
pedantic = { level = "deny", priority = -1 }
# Handler/tool fns take owned extractors by value; this fires constantly and is noise here.
needless_pass_by_value = "allow"
# Row counts and limits cross i64/usize at the sqlx boundary.
cast_possible_truncation = "allow"
cast_sign_loss = "allow"

[dependencies]
anyhow = "1.0.104"
axum = "0.8.9"
chrono = { version = "0.4.45", features = ["serde"] }
dotenvy = "0.15.7"
futures = "0.3.34"
maud = { version = "0.27.0", features = ["axum"] }
rmcp = { version = "3.1.2", features = ["server", "transport-streamable-http-server"] }
schemars = "1.2.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "uuid", "chrono", "migrate", "macros"] }
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["full"] }
tokio-stream = { version = "0.1.19", features = ["sync"] }
tower-http = { version = "0.7.0", features = ["trace", "fs"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
utoipa = { version = "6.0.0", features = ["axum_extras", "uuid", "chrono"] }
utoipa-axum = "0.3.0"
utoipa-scalar = { version = "0.4.0", features = ["axum"] }
uuid = { version = "1.24.0", features = ["v4", "serde"] }

[dev-dependencies]
reqwest = { version = "0.13.4", default-features = false, features = ["json", "stream"] }
