# cargo-deny configuration — https://embarkstudios.github.io/cargo-deny/
# Run with `just deny` (or `cargo deny check`).

[graph]
all-features = true

[advisories]
version = 2
# Fail on crates pulled from a yanked version.
yanked = "deny"
# RUSTSEC ids to consciously ignore (with a reason) go here.
ignore = []

[licenses]
version = 2
confidence-threshold = 0.8
# SPDX license expressions we accept across the dependency tree.
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "Unicode-3.0",
  "CDLA-Permissive-2.0",
]
# Per-crate license exceptions go here as { allow = [...], name = "crate" }.
exceptions = []

[bans]
# Duplicate versions of the same crate bloat the tree but are rarely critical.
multiple-versions = "warn"
wildcards = "deny"
# Internal workspace crates referenced by path have no version requirement;
# don't treat those as forbidden wildcard deps.
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
