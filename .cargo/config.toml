# mold is dramatically faster than the default bfd linker, and every
# integration test target (db, api, ui, sse, mcp) links a full copy of the
# dependency graph, so this speeds up `cargo test` as much as `cargo build`.
#
# Linux-only, like the devShell (flake.nix) that provides mold.
[target.x86_64-unknown-linux-gnu]
rustflags = ["-C", "link-arg=-fuse-ld=mold"]

[target.aarch64-unknown-linux-gnu]
rustflags = ["-C", "link-arg=-fuse-ld=mold"]
