name: ci

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # cog check needs the full git history

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@main

      # Same environment and same checks as the local hooks: nothing mutates.
      - name: Run all checks
        run: nix develop --command just ci
