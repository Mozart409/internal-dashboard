# Git hooks managed by lefthook — https://lefthook.dev
# Installed automatically on `nix develop` via the shellHook.

commit-msg:
  commands:
    cog-verify:
      run: cog verify --file {1}

pre-commit:
  parallel: true
  commands:
    cargo-fmt:
      glob: "*.rs"
      run: cargo fmt --all
      stage_fixed: true
    cargo-clippy:
      glob: "*.rs"
      run: cargo clippy --all-targets -- -D warnings
      env:
        SQLX_OFFLINE: "true"
    keep-sorted:
      run: keep-sorted --mode fix {staged_files}
      stage_fixed: true

pre-push:
  parallel: true
  commands:
    # `just test` depends on db-ready, which starts Postgres if it is not
    # already up — so a stopped container never blocks a push.
    cargo-test:
      run: just test
    cog-check:
      run: cog check
